    name-not-alphanumeric: '{PREFIX} &cНазвание &f%name% &cсодержит недопустимые символы.'
    invalid-argument: "{PREFIX} &cНеверный аргумент: {arg}. Плейсхолдеры в командах запрещены."


COMMAND:
  kit:
    usage: '{PREFIX} &cИспользование: /kit [edit|save] [название]'
    edit:
      usage: '{PREFIX} &cИспользование: /kit edit <название>'
    unknown-subcommand: '{PREFIX} &cНеизвестная подкоманда: &f%subcommand%'
  duel:
    usage:
      - '{LINE}'
      - '&f/%command% [игрок] &e- &7Отправить вызов на дуэль.'
      - '&f/%command% [игрок] <сумма> &e- &7Отправить вызов со ставкой.'
      - '&f/%command% [accept | deny] [игрок] &e- &7Принять или отклонить вызов.'
      - '&f/%command% stats <игрок> &e- &7Показать статистику дуэлей.'
      - '&f/%command% toggle &e- &7Включить или выключить приём вызовов.'
      - '&f/%command% top [-|wins|losses|kit] &e- &7Показать таблицу лидеров.'
      - '{LINE}'
    request:
      send:
        sender:
          - '{LINE}'
          - '&7Вызов на дуэль отправлен игроку &f%name%&7.'
          - '&6- &7Кит: &3%kit%'
          - '&6- &7Свой инвентарь: &r%own_inventory%'
          - '&6- &7Арена: &e%arena%'
          - '&6- &7Ставка: &6$%bet_amount%'
          - '&6- &7Ставка предметами: &r%item_betting%'
          - '{LINE}'
        receiver:
          - '{LINE}'
          - '&7Игрок &f%name% &7вызывает вас на дуэль.'
          - '&6- &7Кит: &3%kit%'
          - '&6- &7Свой инвентарь: &r%own_inventory%'
          - '&6- &7Арена: &e%arena%'
          - '&6- &7Ставка: &6$%bet_amount%'
          - '&6- &7Ставка предметами: &r%item_betting%'
          - '{LINE}'
        clickable-text:
          info:
            text: '&7Нажмите: '
            hover-text: ''
          accept:
            text: '&a&l[ПРИНЯТЬ] '
            hover-text: '&7Принять вызов на дуэль.'
          deny:
            text: '&c&l[ОТКЛОНИТЬ]'
            hover-text: '&7Отклонить вызов на дуэль.'
      accept:
        sender: '{PREFIX} &f%name% &7принял ваш вызов на дуэль.'
        receiver: '{PREFIX} &7Вы приняли вызов игрока &f%name%&7.'
      deny:
        sender: '{PREFIX} &f%name% &7отклонил ваш вызов на дуэль.'
        receiver: '{PREFIX} &7Вы отклонили вызов игрока &f%name%&7.'
    party-request:
      send:
        sender-party:
          - '{LINE}'
          - '&f%owner% &7вызвал на дуэль группу игрока &f%name%&7.'
          - '&6- &7Kit: &3%kit%'
          - '&6- &7Свой инвентарь: &r%own_inventory%'
          - '&6- &7Арена: &e%arena%'
          - '{LINE}'
        receiver-party:
          - '{LINE}'
          - '&7Получен вызов от группы игрока &f%name%&7.'
          - '&6- &7Kit: &3%kit%'
          - '&6- &7Свой инвентарь: &r%own_inventory%'
          - '&6- &7Арена: &e%arena%'
        clickable-text:
          info:
            text: '&7Нажмите: '
            hover-text: ''
          accept:
            text: '&a&l[ПРИНЯТЬ] '
            hover-text: '&7Принять вызов.'
          deny:
            text: '&c&l[ОТКЛОНИТЬ]'
            hover-text: '&7Отклонить вызов.'
          extra:
            text: '{LINE}'
            hover-text: ''
      accept:
        sender-party:
          - '{LINE}'
          - '{PREFIX} &7Группа &f%name% &7приняла вызов игрока &f%owner%&7.'
          - '{LINE}'
        receiver-party:
          - '{LINE}'
          - '{PREFIX} &f%owner% &7принял вызов группы &f%name%&7.'
          - '{LINE}'
      deny:
        sender-party:
          - '{LINE}'
          - '{PREFIX} &7Группа &f%name% &7отклонила вызов игрока &f%owner%&7.'
          - '{LINE}'
        receiver-party:
          - '{LINE}'
          - '{PREFIX} &f%owner% &7отклонил вызов группы &f%name%&7.'
          - '{LINE}'
    stats:
      displayed:
        - '{LINE}'
        - '&7Статистика игрока &f%name% &e-'
        - '&7Победы: &a%wins%'
        - '&7Поражения: &c%losses%'
        - '&7Соотношение побед: &b%wl_ratio%'
        - '&7Приём вызовов: &r%requests_enabled%'
      # NOTE: Ratings will only display if either 'display-kit-ratings' or 'display-nokit-rating' is enabled in the configuration.
      rating:
        header: '&7Рейтинг &e-'
        format: '&f%type%&7: &b%rating%'
        footer: ''
      # NOTE: Past matches will only display if 'display-past-matches' is enabled in the configuration.
      match:
        header: '&7Последние матчи &e-'
        format: '&a%winner% &fпротив &c%loser% &6[Подробнее]'
        hover-text:
          - '&7Кит: &3%kit%'
          - '&7Длительность: &a%duration%'
          - '&7Завершён: &f%time% назад'
          - '&7Здоровье: &d%health%❤'
        footer: '{LINE}'
    toggle:
      enabled: '{PREFIX} &aВы снова принимаете вызовы на дуэль.'
      disabled: '{PREFIX} &cВы больше не принимаете вызовы на дуэль.'
    top:
      next-update: '{PREFIX} &7Следующее обновление: &f%remaining%'
      header: '{HALF_LINE} &7Топ &f10 &7%type% {HALF_LINE}'
      display-format: '&e%rank%. &f%name% &e- &f%score% &7%identifier%'
      footer: '{HALF_LINE} &7Топ &f10 &7%type% {HALF_LINE}'

  duels:
    usage:
      - '{LINE}'
      - '&f/%command% help &e- &7Показать эту страницу.'
      - '&f/%command% help arena &e- &7Команды управления аренами.'
      - '&f/%command% help kit &e- &7Команды управления китами.'
      - '&f/%command% help queue &e- &7Команды управления очередями.'
      - '&f/%command% help sign &e- &7Команды управления табличками.'
      - '&f/%command% help user &e- &7Команды изменения игроков.'
      - '&f/%command% help extra &e- &7Дополнительные команды.'
      - '{LINE}'
    help:
      arena:
        - '{HALF_LINE} &fКоманды арен {HALF_LINE}'
        - '&f/%command% create [название] &e- &7Создать арену.'
        - '&f/%command% set [название] [1|2] &e- &7Установить точку появления.'
        - '&f/%command% delete [название] &e- &7Удалить арену.'
        - '&f/%command% setarenaitem [название] &e- &7Изменить значок арены.'
        - '&f/%command% info [название] &e- &7Показать сведения об арене.'
        - '&f/%command% toggle [название] &e- &7Включить или выключить арену.'
        - '&f/%command% tp [название] <1|2> &e- &7Телепортироваться на арену.'
        - '&f/%command% list &e- &7Показать список арен.'
        - '{HALF_LINE} &fКоманды арен {HALF_LINE}'
      kit:
        - '{HALF_LINE} &fКоманды китов {HALF_LINE}'
        - '&f/%command% savekit <-o> [название] &e- &7Сохранить кит.'
        - '&f/%command% loadkit [название] &e- &7Загрузить кит в инвентарь.'
        - '&f/%command% deletekit [название] &e- &7Удалить кит.'
        - '&f/%command% setitem [название] &e- &7Изменить значок кита.'
        - '&f/%command% options [кит] &e- &7Открыть настройки кита.'
        - '&f/%command% bind [кит] &e- &7Привязать кит к аренам.'
        - '&f/%command% list &e- &7Показать список китов.'
        - '{HALF_LINE} &fКоманды китов {HALF_LINE}'
      queue:
        - '{HALF_LINE} &fQueue Sign Commands {HALF_LINE}'
        - '&f/%command% createqueue [bet] [-|kit] &e- &7Creates a queue with bet and kit.'
        - '&f/%command% deletequeue &e- &7Deletes the queue with bet and kit.'
        - '&f/%command% list &e- &7Displays a list of available queues.'
        - '{HALF_LINE} &fQueue Sign Commands {HALF_LINE}'
      sign:
        - '{HALF_LINE} &fQueue Sign Commands {HALF_LINE}'
        - '&f/%command% addsign [bet] [-|kit] &e- &7Creates a queue sign with bet and kit.'
        - '&f/%command% delsign &e- &7Deletes the queue sign you are looking at.'
        - '&f/%command% list &e- &7Displays a list of queue signs.'
        - '{HALF_LINE} &fQueue Sign Commands {HALF_LINE}'
      user:
        - '{HALF_LINE} &fUser Edit Commands {HALF_LINE}'
        - '&f/%command% setrating [name] [-|kit] [amount] &e- &7Sets player''s rating for kit.'
        - '&f/%command% edit [name] [add|remove|set] [wins|losses] [amount] &e- &7Edits player''s stats.'
        - '&f/%command% resetrating [name] [-|kit|all] &e- &7Resets all or specified kit''s rating for player.'
        - '&f/%command% reset [name] &e- &7Resets player''s stats.'
        - '{HALF_LINE} &fUser Edit Commands {HALF_LINE}'
      extra:
        - '{HALF_LINE} &fExtra Commands {HALF_LINE}'
        - '&f/%command% setlobby &e- &7Sets duel lobby location.'
        - '&f/%command% lobby &e- &7Teleports to duel lobby.'
        - '&f/%command% playsound [name] &e- &7Plays the selected sound if defined in config.'
        - '&f/%command% reload <module> &e- &7Reloads the plugin or the specified module.'
        - '{HALF_LINE} &fExtra Commands {HALF_LINE}'
    create: '{PREFIX} &7Арена &e%name% &7создана. Установите точки: &f/duels set %name% 1'
    delete: '{PREFIX} &7Арена &e%name% &7удалена.'
    set: '{PREFIX} &7Точка &f%position% &7арены &e%name% &7установлена: &f%location%&7.'
    toggle: '{PREFIX} &7Арена &e%name%&7: &r%state%&7.'
    disable: '{PREFIX} &7Арена &e%name% &cвыключена&7.'
    enable: '{PREFIX} &7Арена &e%name% &aвключена&7.'
    already-disabled: '{PREFIX} &cАрена &f%name% &cуже выключена.'
    already-enabled: '{PREFIX} &cАрена &f%name% &cуже включена.'
    teleport: '{PREFIX} &7Вы телепортированы на точку &f%position% &7арены &e%name%&7.'
    save-kit: '{PREFIX} &7Кит &3%name% &7сохранён.'
    delete-kit: '{PREFIX} &7Кит &3%name% &7удалён.'
    load-kit: '{PREFIX} &7Кит &3%name% &7загружен в инвентарь.'
    set-item: '{PREFIX} &7Kit &3%name%&7''s displayed item was changed to your held item.'
    set-arena-item: '{PREFIX} &7Arena &e%name%&7''s displayed item was changed to your held item.'
    create-queue: '{PREFIX} &7Created a queue with kit &3%kit% &7and bet &6$%bet_amount%&7.'
    delete-queue: '{PREFIX} &7Deleted a queue with kit &3%kit% &7and bet &6$%bet_amount%&7.'
    add-sign: '{PREFIX} &7Created queue sign at &f%location% &7with kit &3%kit% &7and bet &6$%bet_amount%&7.'
    del-sign: '{PREFIX} &7Deleted queue sign at &f%location% &7with kit &3%kit% &7and bet &6$%bet_amount%&7.'
    set-lobby: '{PREFIX} &7Лобби дуэлей установлено в текущей точке.'
    lobby: '{PREFIX} &7Вы телепортированы в лобби.'
    edit: '{PREFIX} &7Following action has been executed for &f%name%&7: &f%action% %amount% %type%'
