    in-creative-mode: '{PREFIX} &cКто-то из вашей группы находится в творческом режиме.'
    in-blacklisted-world: '{PREFIX} &cКто-то из вашей группы находится в запрещённом мире.'
    is-tagged: '{PREFIX} &cКто-то из вашей группы участвует в другом бою.'
    not-in-duelzone: '{PREFIX} &cКто-то из вашей группы находится вне зоны дуэлей: %regions%'
    already-has-request: '{PREFIX} &cВы уже отправили вызов группе игрока &f%name%&c.'
    no-request: '{PREFIX} &cУ вас нет вызова от группы игрока &f%name%&c.'
    already-in-match:
