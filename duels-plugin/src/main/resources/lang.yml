      target: '{PREFIX} &cГруппа игрока &f%name% &cуже участвует в дуэли.'
    already-spectating:
      sender: '{PREFIX} &cКто-то из вашей группы находится в режиме наблюдателя.'
      target: '{PREFIX} &cУчастник группы &f%name% &cнаходится в режиме наблюдателя.'
    option-unavailable: '{PREFIX} &cСтавки недоступны для групповых дуэлей.'
  party:
    is-self: '{PREFIX} &cНельзя создать группу с самим собой.'
    is-not-owner: '{PREFIX} &cЭто действие доступно только владельцу группы.'
    is-owner: '{PREFIX} &cВладелец не может покинуть группу. Передайте её или распустите.'
    requests-disabled: '{PREFIX} &cИгрок &f%name% &cне принимает приглашения в группу.'
    already-has-invite: '{PREFIX} &cВы уже пригласили игрока &f%name%&c.'
    no-invite: '{PREFIX} &cУ вас нет приглашения от игрока &f%name%&c.'
    not-found: '{PREFIX} &cЭта группа больше не существует.'
    already-in-party:
      sender: '{PREFIX} &cВы уже состоите в группе.'
      target: '{PREFIX} &cИгрок &f%name% &cуже состоит в группе.'
    not-in-party:
      sender: '{PREFIX} &cВы не состоите в группе.'
      target: '{PREFIX} &cИгрок &f%name% &cне состоит в группе.'
    not-a-member: '{PREFIX} &cИгрок &f%name% &cне состоит в вашей группе.'
    in-same-party: '{PREFIX} &cИгрок &f%name% &cуже в вашей группе.'
    kick-self: '{PREFIX} &cНельзя исключить самого себя.'
    is-not-same-size: '{PREFIX} &cВ группах должно быть одинаковое количество игроков.'
    is-not-online:
      sender: '{PREFIX} &cВсе участники вашей группы должны быть в сети.'
      target: '{PREFIX} &cВсе участники группы &f%name% &cдолжны быть в сети.'
    max-size-reached:
      sender: '{PREFIX} &cВ вашей группе достигнут лимит участников.'
      target: '{PREFIX} &cВ группе игрока &f%name% &cдостигнут лимит участников.'
    cannot-friendly-fire: '{PREFIX} &cУрон по участникам своей группы выключен.'
  setting:
    disabled-option: '{PREFIX} &cНастройка &f%option% &cвыключена.'
    arena-not-applicable: '{PREFIX} &cКит &f%kit% &cнельзя использовать на арене &f%arena%&c.'
  inventory-view:
    not-a-uuid: '{PREFIX} &cЗначение &f%input% &cне является UUID.'
    not-found: '{PREFIX} &cИнвентарь с UUID &f%uuid% &cне найден.'
  queue:
    not-found: '{PREFIX} &cОчередь с китом &f%kit% &cи ставкой $%bet_amount% не найдена.'
    already-exists: '{PREFIX} &cТакая очередь уже существует.'
    already-in: '{PREFIX} &cВы уже находитесь в очереди.'
    not-in-queue: '{PREFIX} &cВы не находитесь в очереди.'
    not-enough-money: '{PREFIX} &cДля входа в очередь требуется $%bet_amount%.'
    no-queues-available: '{PREFIX} &cНет доступных очередей.'
  sign:
    not-a-sign: '{PREFIX} &cВы смотрите не на табличку.'
    not-found: '{PREFIX} &cЭта табличка не относится к очереди.'
    already-exists: '{PREFIX} &cЭта табличка уже используется. Для удаления: &f/duels delsign'
    cancel-break: '{PREFIX} &cТабличку очереди нельзя сломать вручную. Используйте &f/duels delsign'
  sound:
    not-found: '{PREFIX} &cЗвук &f%name% &cне найден.'
  command:
    invalid-sub-command: '{PREFIX} &cНеизвестная подкоманда &f%argument%&c. Помощь: &f/%command%'
    invalid-option: '{PREFIX} &cНеизвестная настройка &f%option%&c. Доступно: &f%available_options%'
    invalid-action: '{PREFIX} &cНеизвестное действие &f%action%&c. Доступно: &f%available_actions%'
    not-enough-money: '{PREFIX} &cНедостаточно денег для ставки.'
